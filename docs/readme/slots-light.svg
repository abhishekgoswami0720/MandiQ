<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" fill="none" role="img" aria-labelledby="t"><title id="t">A morning of 15-minute slots: served, now at the weighbridge, waiting, halted</title><style>.s{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes c{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.c{animation:c .4s ease-out both}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 1.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="210" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="209" rx="20" fill="#ffffff" stroke="#dde3ee"/><text class="s" x="40" y="44" font-size="18" font-weight="700" fill="#14203a">One farmer per 15-minute slot</text><text class="s" x="40" y="66" font-size="13.5" fill="#55617a">no overlaps and no jumping the queue: each slot holds one booking, and each phone number one active booking</text><rect class="c" x="62.0" y="92" width="51.0" height="44" rx="7" fill="#15803d" fill-opacity="0.8" style="animation-delay:0.00s"/><text class="m" x="87.5" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">001</text><text class="m" x="62.0" y="156" font-size="11" fill="#8b96ab">09:00</text><rect class="c" x="117.0" y="92" width="51.0" height="44" rx="7" fill="#15803d" fill-opacity="0.8" style="animation-delay:0.05s"/><text class="m" x="142.5" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">002</text><rect class="c" x="172.0" y="92" width="51.0" height="44" rx="7" fill="#15803d" fill-opacity="0.8" style="animation-delay:0.10s"/><text class="m" x="197.5" y="119" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">003</text><rect class="c" x