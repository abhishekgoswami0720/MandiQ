<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" fill="none" role="img" aria-labelledby="t"><title id="t">Before and after MandiQ: fair slots, tokens by phone, one booking per number, halt with SMS</title><style>.s{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes fade{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}.fade{animation:fade .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="424" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="423" rx="20" fill="#ffffff" stroke="#dde3ee"/><text class="s" x="270" y="56" font-size="15" font-weight="800" fill="#c81e1e">Today at the mandi</text><text class="s" x="630" y="56" font-size="15" font-weight="800" fill="#15803d">With MandiQ</text><line x1="40" y1="80" x2="960" y2="80" stroke="#dde3ee"/><g class="fade" style="animation-delay:0.20s"><text class="s" x="40" y="128" font-size="15" font-weight="700" fill="#14203a">Who goes first</text><rect x="258" y="102" width="340" height="44" rx="10" fill="#c81e1e" fill-opacity=".08"/><path d="M270,118 l8,8 m0,-8 l-8,8" stroke="#c81e1e" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="290" y="129" font-size="14" fill="#55617a">Whoever knows someone, or pays</text></g><g class="fade" style="animation-delay:0.45s"><rect x="618" y="102" width="342" height="44" rx="10" fill="#15803d" fill-opacity=".1"/><path d="M630,123 l4,4 8,-9" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="650" y="129" font-size="14" font-weight="600" fill="#14203a">Fixed 15-minute slots, given in order</text></g><g class="fade" style="animation-delay:0.35s"><text class="s" x="40" y="202" font-size="15" font-weight="700" fill="#14203a">Knowing when to come</text><rect x="258" y="176" width="340" height="44" rx="10" fill="#c81e1e" fill-opacity=".08"/><path d="M270,192 l8,8 m0,-8 l-8,8" stroke="#c81e1e" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="290" y="203" font-size="14" fill="#55617a">Wait at the gate for hours or days</text></g><g class="fade" style="animation-delay:0.60s"><rect x="618" y="176" width="342" height="44" rx="10" fill="#15803d" fill-opacity=".1"/><path d="M630,197 l4,4 8,-9" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="650" y="203" font-size="14" font-weight="600" fill="#14203a">Call and hear your token and time</text></g><g class="fade" style="animation-delay:0.50s"><text class="s" x="40" y="276" font-size="15" font-weight="700" fill="#14203a">Fake bookings</text><rect x="258" y="250" width="340" height="44" rx="10" fill="#c81e1e" fill-opacity=".08"/><path d="M270,266 l8,8 m0,-8 l-8,8" stroke="#c81e1e" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="290" y="277" font-size="14" fill="#55617a">Middlemen book slots under many names</text></g><g class="fade" style="animation-delay:0.75s"><rect x="618" y="250" width="342" height="44" rx="10" fill="#15803d" fill-opacity=".1"/><path d="M630,271 l4,4 8,-9" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="650" y="277" font-size="14" font-weight="600" fill="#14203a">One active booking per phone number</text></g><g class="fade" style="animation-delay:0.65s"><text class="s" x="40" y="350" font-size="15" font-weight="700" fill="#14203a">When the mandi stops</text><rect x="258" y="324" width="340" height="44" rx="10" fill="#c81e1e" fill-opacity=".08"/><path d="M270,340 l8,8 m0,-8 l-8,8" stroke="#c81e1e" stroke-width="2.2" stroke-linecap="round"/><text class="s" x="290" y="351" font-size="14" fill="#55617a">Farmers find out at the gate</text></g><g class="fade" style="animation-delay:0.90s"><rect x="618" y="324" width="342" height="44" rx="10" fill="#15803d" fill-opacity=".1"/><path d="M630,345 l4,4 8,-9" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text class="s" x="650" y="351" font-size="14" font-weight="600" fill="#14203a">One click moves all to tomorrow, plus an SMS</text></g></svg>